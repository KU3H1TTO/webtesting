<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่ฮาร์ดแวร์คอมพิวเตอร์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 3D Card Flip Effects */
        .memory-card {
            width: 100%;
            /* ปรับสัดส่วนให้เป็น 1:1 หรือจัตุรัส เพื่อไม่ให้การ์ดยาวเกินไปจนต้องเลื่อนจอ */
            aspect-ratio: 1 / 1; 
            perspective: 1000px;
            cursor: pointer;
        }

        .memory-card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 0.75rem;
        }

        .memory-card.flipped .memory-card-inner {
            transform: rotateY(180deg);
        }

        .memory-card.matched .memory-card-inner {
            transform: rotateY(180deg);
            box-shadow: 0 0 15px 5px rgba(74, 222, 128, 0.5);
        }

        .memory-card-front, .memory-card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            padding: 5px;
            text-align: center;
        }

        .memory-card-back {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: 2px solid #a78bfa;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .memory-card-back::after {
            content: '?';
            font-size: 4rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .memory-card-front {
            background-color: #ffffff;
            color: #1f2937;
            transform: rotateY(180deg);
            border: 3px solid #e5e7eb;
        }

        .memory-card.matched .memory-card-front {
            background-color: #f0fdf4;
            border-color: #4ade80;
        }

        /* Responsive grid - เต็มจอ */
        #game-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 1rem;
        }

        @media (max-width: 1280px) {
            #game-board {
                grid-template-columns: repeat(5, 1fr);
                gap: 1rem;
            }
        }

        @media (max-width: 768px) {
            #game-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.75rem;
                padding: 0.5rem;
            }
        }
        
        @media (max-width: 480px) {
            #game-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.5rem;
            }
        }

        .win-modal {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- ปุ่มเปิดการ์ด (Answer) มุมขวาบน -->
    <div class="absolute top-4 right-4 md:top-6 md:right-6 z-50 flex items-center h-12">
        <button id="reveal-btn" onclick="requestReveal()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-full shadow-lg transition-transform transform hover:scale-105">
            Answer
        </button>
        <div id="reveal-confirm-group" style="display: none;" class="gap-2">
            <span class="text-white font-semibold mr-1 self-center bg-black/50 px-3 py-1 rounded-full text-sm">เปิดทั้งหมด?</span>
            <button onclick="revealAllCards()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105">
                ยืนยัน
            </button>
            <button onclick="cancelReveal()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105">
                ยกเลิก
            </button>
        </div>
    </div>

    <div class="w-full px-2 py-4 flex-grow flex flex-col">
        <header class="w-full max-w-full px-4 mx-auto mb-6">
            <div class="text-center mb-6">
                <!-- เพิ่ม pb-3 เพื่อให้แสดงสระอูและวรรณยุกต์ด้านล่างได้ครบถ้วน -->
                <h1 class="text-3xl md:text-5xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-green-300 pb-3">
                    <i class="fas fa-desktop mr-2 text-white"></i>จับคู่ฮาร์ดแวร์ (ผู้เล่น 2 ทีม)
                </h1>
            </div>

            <div class="flex justify-between items-center bg-white/10 p-4 md:p-6 rounded-2xl backdrop-blur-md shadow-xl border border-white/20 max-w-6xl mx-auto">
                <div id="team1-panel" class="flex flex-col items-center bg-blue-600/80 p-4 w-1/3 max-w-[200px] rounded-xl shadow-lg border-4 border-yellow-400 transition-all duration-300">
                    <h2 class="text-lg md:text-2xl font-bold text-white mb-2"><i class="fas fa-user-ninja mr-2"></i>ทีม 1</h2>
                    <span id="team1-score" class="text-4xl md:text-5xl font-bold text-yellow-300">0</span>
                </div>

                <div class="flex flex-col items-center justify-center space-y-4 px-2">
                    <div id="turn-indicator" class="text-lg md:text-2xl font-bold bg-blue-500 px-4 md:px-8 py-2 md:py-3 rounded-full text-white shadow-[0_0_15px_rgba(59,130,246,0.5)] transition-colors duration-300">
                        ตาของ: ทีม 1
                    </div>
                    <button onclick="initGame()" class="bg-gradient-to-r from-gray-700 to-gray-900 hover:from-gray-600 hover:to-gray-800 text-white font-bold py-2 px-6 rounded-full transition-transform transform hover:scale-105 shadow-lg flex items-center">
                        <i class="fas fa-redo mr-2"></i>เริ่มใหม่
                    </button>
                </div>

                <div id="team2-panel" class="flex flex-col items-center bg-red-600/50 p-4 w-1/3 max-w-[200px] rounded-xl shadow-lg border-4 border-transparent opacity-70 transition-all duration-300">
                    <h2 class="text-lg md:text-2xl font-bold text-white mb-2"><i class="fas fa-user-astronaut mr-2"></i>ทีม 2</h2>
                    <span id="team2-score" class="text-4xl md:text-5xl font-bold text-yellow-300">0</span>
                </div>
            </div>
        </header>

        <main id="game-board" class="w-full">
            <!-- Cards will be generated here by JS -->
        </main>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="win-modal fixed inset-0 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-500">
        <div class="bg-white text-gray-800 p-8 rounded-2xl shadow-2xl text-center max-w-sm w-full mx-4 transform scale-95 transition-transform duration-500" id="win-modal-content">
            <div class="text-6xl mb-4 text-yellow-400">
                <i class="fas fa-trophy"></i>
            </div>
            <h2 id="win-title" class="text-4xl font-bold mb-2 text-green-600">ทีม 1 ชนะ!</h2>
            <p class="text-lg mb-4 text-gray-600">เกมจบแล้ว การจับคู่ครบทั้งหมด</p>
            <div class="bg-gray-100 p-4 rounded-xl mb-6 shadow-inner text-lg font-semibold space-y-2" id="final-score-text">
                <p class="text-blue-600">ทีม 1: 0 คะแนน</p>
                <p class="text-red-600">ทีม 2: 0 คะแนน</p>
            </div>
            <button onclick="initGame()" class="w-full bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold py-3 px-6 rounded-xl transition duration-300 shadow-md text-lg">
                เล่นอีกครั้ง
            </button>
        </div>
    </div>

    <script>
        const hardwareItems = [
            { id: 1, word: 'Keyboard', icon: 'fas fa-keyboard', image: 'pic/Keyboard.png', color: 'text-red-500' },
            { id: 2, word: 'Mouse', icon: 'fas fa-mouse', image: 'pic/Mouse.png', color: 'text-red-500' },
            { id: 3, word: 'Scanner', icon: 'fas fa-print', image: 'pic/Scanner.png', color: 'text-orange-500' },
            /* ใส่ <br> ให้ Barcode Reader ขึ้นบรรทัดใหม่ */
            { id: 4, word: 'Barcode<br>Reader', icon: 'fas fa-barcode', image: 'pic/BarcodeReader.png', color: 'text-purple-500' },
            { id: 5, word: 'Microphone', icon: 'fas fa-microphone', image: 'pic/Microphone.jpg', color: 'text-blue-500' },
            { id: 6, word: 'Controller', icon: 'fas fa-headphones', image: 'pic/Controller.jpg', color: 'text-orange-500' },
            { id: 7, word: 'CPU', icon: 'fas fa-microchip', image: 'pic/CPU.jpg', color: 'text-blue-500' },
            { id: 8, word: 'RAM', icon: 'fas fa-memory', image: 'pic/RAM.png', color: 'text-green-500' },
            { id: 9, word: 'CMOS', icon: 'fas fa-battery-quarter', image: 'pic/CMOS.png', color: 'text-green-500' },
            { id: 10, word: 'HDD', icon: 'fas fa-hard-drive', image: 'pic/HDD.png', color: 'text-green-500' },
            { id: 11, word: 'SSD',   icon: 'fas fa-hard-drive', image: 'pic/SSD.png', color: 'text-purple-500' },
            { id: 12, word: 'Monitor', icon: 'fas fa-display', image: 'pic/Monitor.png', color: 'text-teal-500' },
            { id: 13, word: 'Printer', icon: 'fas fa-print', image: 'pic/Printer.png', color: 'text-blue-500'    },
            { id: 14, word: 'Projector', icon: 'fas fa-film', image: 'pic/Projector.png', color: 'text-orange-500' },
            { id: 15, word: 'Speaker', icon: 'fas fa-headphones', image: 'pic/Speaker.jpg', color: 'text-teal-500' },,
        ];

        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let team1Score = 0;
        let team2Score = 0;
        let currentPlayer = 1; 
        let matchedPairs = 0;

        const gameBoard = document.getElementById('game-board');
        const winModal = document.getElementById('win-modal');
        const winModalContent = document.getElementById('win-modal-content');

        function initGame() {
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            team1Score = 0;
            team2Score = 0;
            currentPlayer = 1;
            matchedPairs = 0;
            
            updateDisplay();
            hideWinModal();
            cancelReveal(); // รีเซ็ตปุ่ม Answer ทุกครั้งที่เริ่มใหม่
            
            cards = [];
            hardwareItems.forEach(item => {
                let visualContent = item.image ? 
                    `<img src="${item.image}" alt="${item.word.replace('<br>', ' ')}" class="w-full h-full object-contain p-0 rounded">` : 
                    `<i class="${item.icon} text-5xl md:text-6xl lg:text-[5rem] ${item.color}"></i>`;
                
                // การ์ดรูปภาพ
                cards.push({
                    id: item.id,
                    type: 'visual',
                    html: visualContent
                });
                
                // การ์ดคำศัพท์ (เพิ่มไอคอนไว้ด้านบนและข้อความอยู่บรรทัดล่าง)
                cards.push({
                    id: item.id,
                    type: 'word',
                    html: `<div class="flex flex-col items-center justify-center w-full h-full">
                               <i class="${item.icon} text-3xl md:text-4xl lg:text-5xl ${item.color} mb-1"></i>
                               <span class="text-sm sm:text-base md:text-lg lg:text-xl font-bold text-gray-800 text-center px-1 leading-tight break-words">${item.word}</span>
                           </div>`
                });
            });

            shuffleArray(cards);
            renderBoard();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderBoard() {
            gameBoard.innerHTML = '';
            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('memory-card');
                cardElement.dataset.id = card.id;
                cardElement.dataset.index = index;

                cardElement.innerHTML = `
                    <div class="memory-card-inner">
                        <div class="memory-card-front shadow-inner">
                            ${card.html}
                        </div>
                        <div class="memory-card-back shadow-md hover:shadow-xl transition-shadow">
                        </div>
                    </div>
                `;

                cardElement.addEventListener('click', flipCard);
                gameBoard.appendChild(cardElement);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return; 
            if (this.classList.contains('matched')) return; 

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            updateDisplay();
            
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.id === secondCard.dataset.id;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            
            if (currentPlayer === 1) {
                team1Score++;
                firstCard.querySelector('.memory-card-front').classList.add('border-blue-500', 'border-4');
                secondCard.querySelector('.memory-card-front').classList.add('border-blue-500', 'border-4');
            } else {
                team2Score++;
                firstCard.querySelector('.memory-card-front').classList.add('border-red-500', 'border-4');
                secondCard.querySelector('.memory-card-front').classList.add('border-red-500', 'border-4');
            }

            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            matchedPairs++;

            currentPlayer = currentPlayer === 1 ? 2 : 1;
            
            updateDisplay();
            resetBoard();

            if (matchedPairs === hardwareItems.length) {
                setTimeout(showWinModal, 500);
            }
        }

        function unflipCards() {
            lockBoard = true; 
            
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateDisplay();

            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function updateDisplay() {
            document.getElementById('team1-score').innerText = team1Score;
            document.getElementById('team2-score').innerText = team2Score;
            
            const team1Panel = document.getElementById('team1-panel');
            const team2Panel = document.getElementById('team2-panel');
            const turnIndicator = document.getElementById('turn-indicator');

            if (currentPlayer === 1) {
                team1Panel.classList.add('border-yellow-400', 'scale-105', 'bg-blue-600/80');
                team1Panel.classList.remove('border-transparent', 'opacity-70', 'bg-blue-600/50');
                team2Panel.classList.remove('border-yellow-400', 'scale-105', 'bg-red-600/80');
                team2Panel.classList.add('border-transparent', 'opacity-70', 'bg-red-600/50');
                
                turnIndicator.innerText = "ตาของ: ทีม 1";
                turnIndicator.className = "text-lg md:text-2xl font-bold px-4 md:px-8 py-2 md:py-3 rounded-full text-white transition-all duration-300 bg-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.5)]";
            } else {
                team2Panel.classList.add('border-yellow-400', 'scale-105', 'bg-red-600/80');
                team2Panel.classList.remove('border-transparent', 'opacity-70', 'bg-red-600/50');
                team1Panel.classList.remove('border-yellow-400', 'scale-105', 'bg-blue-600/80');
                team1Panel.classList.add('border-transparent', 'opacity-70', 'bg-blue-600/50');
                
                turnIndicator.innerText = "ตาของ: ทีม 2";
                turnIndicator.className = "text-lg md:text-2xl font-bold px-4 md:px-8 py-2 md:py-3 rounded-full text-white transition-all duration-300 bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]";
            }
        }

        function showWinModal() {
            const winTitle = document.getElementById('win-title');
            const finalScoreText = document.getElementById('final-score-text');

            if (team1Score > team2Score) {
                winTitle.innerText = "ทีม 1 ชนะ!";
                winTitle.className = "text-4xl font-bold mb-2 text-blue-600";
            } else if (team2Score > team1Score) {
                winTitle.innerText = "ทีม 2 ชนะ!";
                winTitle.className = "text-4xl font-bold mb-2 text-red-600";
            } else {
                winTitle.innerText = "เสมอ!";
                winTitle.className = "text-4xl font-bold mb-2 text-yellow-500";
            }

            finalScoreText.innerHTML = `
                <p class="text-blue-600">ทีม 1 (น้ำเงิน): ${team1Score} คะแนน</p>
                <p class="text-red-600">ทีม 2 (แดง): ${team2Score} คะแนน</p>
            `;

            winModal.classList.remove('hidden');
            setTimeout(() => {
                winModal.classList.remove('opacity-0');
                winModal.classList.add('opacity-100');
                winModalContent.classList.remove('scale-95');
                winModalContent.classList.add('scale-100');
            }, 10);
        }

        function hideWinModal() {
            winModal.classList.remove('opacity-100');
            winModal.classList.add('opacity-0');
            winModalContent.classList.remove('scale-100');
            winModalContent.classList.add('scale-95');
            
            setTimeout(() => {
                winModal.classList.add('hidden');
            }, 500);
        }

        /* ----- เพิ่มฟังก์ชันสำหรับปุ่ม Answer ----- */
        function requestReveal() {
            document.getElementById('reveal-btn').style.display = 'none';
            document.getElementById('reveal-confirm-group').style.display = 'flex';
        }

        function cancelReveal() {
            const btn = document.getElementById('reveal-btn');
            const group = document.getElementById('reveal-confirm-group');
            if(btn && group) {
                btn.style.display = '';
                group.style.display = 'none';
            }
        }

        function revealAllCards() {
            cancelReveal();
            const allCards = document.querySelectorAll('.memory-card');
            allCards.forEach(card => {
                if (!card.classList.contains('matched')) {
                    card.classList.add('flipped');
                }
            });
            lockBoard = true; // ล็อคกระดานไม่ให้กดต่อได้อีก
        }

        window.onload = initGame;
    </script>
</body>
</html>
